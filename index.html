<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pet Diary</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="theme-color" content="#FFA9C4">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Pet Diary">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>
html,body{margin:0;height:100%;background:#FFF7F0;transition:background .3s;font-family:system-ui,-apple-system,sans-serif;overflow:hidden}
#sb{position:fixed;left:0;right:0;top:0;height:env(safe-area-inset-top);background:#FFA9C4;z-index:2;transition:background .3s}
iframe{position:fixed;left:0;right:0;top:env(safe-area-inset-top);bottom:0;width:100%;height:calc(100% - env(safe-area-inset-top));border:0;background:transparent}
#setup{position:fixed;inset:0;display:none;place-items:center;padding:24px;text-align:center;color:#4B3A34}
#setup.on{display:grid}
#setup input{width:100%;max-width:420px;padding:12px;border-radius:14px;border:1.5px solid #F3D5DC;font-size:15px;box-sizing:border-box}
#setup button{margin-top:12px;border:0;border-radius:14px;padding:12px 22px;background:#FFA9C4;color:#3b2a24;font-weight:700;font-size:16px}
</style>
</head>
<body>
<!-- วาง URL ของ Web App (ลงท้าย /exec) ระหว่างเครื่องหมายคำพูดด้านล่าง หรือเว้นว่างไว้เพื่อให้แอปถามตอนเปิดครั้งแรก -->
<script>var APP_URL = "https://script.google.com/macros/s/AKfycbx_P7UXeVlPLygbEsaRwtqtnHAgml4jqGI8taa0KDJYmIepEbluBCyjxXKBx5fZ3kOA/exec";</script>
<div id="setup"><div>
  <div style="font-size:52px">🐶</div>
  <h2>Pet Diary</h2>
  <p>วางลิงก์ Web App ของคุณ (ลงท้าย /exec)</p>
  <input id="u" placeholder="https://script.google.com/macros/s/.../exec" inputmode="url">
  <br><button id="go">เริ่มใช้งาน</button>
</div></div>
<div id="sb"></div>
<iframe id="f" title="Pet Diary" allow="clipboard-write" hidden></iframe>
<script>
(function(){
  var url = APP_URL;
  try { url = url || localStorage.getItem('pd_app_url') || ''; } catch(e) {}
  var f = document.getElementById('f'), s = document.getElementById('setup');
  var meta = document.querySelector('meta[name=theme-color]'), sb = document.getElementById('sb');
  var th = null;
  try { th = JSON.parse(localStorage.getItem('pd_theme') || 'null'); } catch(e) {}
  function paint(t){
    if (!t || !/^#[0-9A-Fa-f]{6}$/.test(t.color || '')) return;
    meta.setAttribute('content', t.color);
    sb.style.background = t.color;
    if (/^#[0-9A-Fa-f]{6}$/.test(t.bg || '')) document.body.style.background = document.documentElement.style.background = t.bg;
  }
  paint(th);
  window.addEventListener('message', function(e){
    var d = e.data && e.data.pdTheme;
    if (!d || !/(\.googleusercontent\.com|script\.google\.com)$/.test(e.origin.replace(/:\d+$/, ''))) return;
    var t = { accent: String(d.accent || ''), mode: d.mode === 'dark' ? 'dark' : 'light', color: String(d.color || ''), bg: String(d.bg || '') };
    paint(t);
    try { localStorage.setItem('pd_theme', JSON.stringify(t)); } catch(err) {}
  });
  function withTheme(u){
    if (!th || !/^[a-z]+$/.test(th.accent || '')) return u;
    return u + (u.indexOf('?') < 0 ? '?' : '&') + 'accent=' + th.accent + '&mode=' + th.mode;
  }
  function start(u){ f.src = withTheme(u); f.hidden = false; s.classList.remove('on'); }
  if (url) start(url); else s.classList.add('on');
  document.getElementById('go').onclick = function(){
    var v = document.getElementById('u').value.trim();
    if (!/^https:\/\/script\.google\.com\//.test(v)) { alert('ลิงก์ต้องขึ้นต้นด้วย https://script.google.com/'); return; }
    try { localStorage.setItem('pd_app_url', v); } catch(e) {}
    start(v);
  };
  if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(function(){});
})();
</script>
</body>
</html>
