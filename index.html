<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pet Diary</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="theme-color" content="#FFA9C4">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Pet Diary">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<style>
html,body{margin:0;height:100%;background:#FFF7F0;font-family:system-ui,-apple-system,sans-serif;overflow:hidden}
iframe{position:fixed;inset:0;width:100%;height:100%;border:0;background:#FFF7F0}
#setup{position:fixed;inset:0;display:none;place-items:center;padding:24px;text-align:center;color:#4B3A34}
#setup.on{display:grid}
#setup input{width:100%;max-width:420px;padding:12px;border-radius:14px;border:1.5px solid #F3D5DC;font-size:15px;box-sizing:border-box}
#setup button{margin-top:12px;border:0;border-radius:14px;padding:12px 22px;background:#FFA9C4;color:#3b2a24;font-weight:700;font-size:16px}
</style>
</head>
<body>
<!-- วาง URL ของ Web App (ลงท้าย /exec) ระหว่างเครื่องหมายคำพูดด้านล่าง หรือเว้นว่างไว้เพื่อให้แอปถามตอนเปิดครั้งแรก -->
<script>var APP_URL = "https://script.google.com/macros/s/AKfycbx_P7UXeVlPLygbEsaRwtqtnHAgml4jqGI8taa0KDJYmIepEbluBCyjxXKBx5fZ3kOA/exec";</script>
<div id="setup"><div>
  <div style="font-size:52px">🐶</div>
  <h2>Pet Diary</h2>
  <p>วางลิงก์ Web App ของคุณ (ลงท้าย /exec)</p>
  <input id="u" placeholder="https://script.google.com/macros/s/.../exec" inputmode="url">
  <br><button id="go">เริ่มใช้งาน</button>
</div></div>
<iframe id="f" title="Pet Diary" allow="clipboard-write" hidden></iframe>
<script>
(function(){
  var url = APP_URL;
  try { url = url || localStorage.getItem('pd_app_url') || ''; } catch(e) {}
  var f = document.getElementById('f'), s = document.getElementById('setup');
  function start(u){ f.src = u; f.hidden = false; s.classList.remove('on'); }
  if (url) start(url); else s.classList.add('on');
  document.getElementById('go').onclick = function(){
    var v = document.getElementById('u').value.trim();
    if (!/^https:\/\/script\.google\.com\//.test(v)) { alert('ลิงก์ต้องขึ้นต้นด้วย https://script.google.com/'); return; }
    try { localStorage.setItem('pd_app_url', v); } catch(e) {}
    start(v);
  };
  if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(function(){});
})();
</script>
</body>
</html>
